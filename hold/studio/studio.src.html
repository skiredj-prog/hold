<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOLD Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E7ECEF; --paper-deep:#DAE2E8; --ink:#1C2541; --ink-soft:#4A5573; --ink-faint:#6E7A93;
  --line:#93A8BF; --grid:rgba(120,145,172,.16);
  --chalk:#E6B93C; --chalk-soft:#F5E6B5; --mark:#B23A2E; --mark-soft:#F1D9D5; --pass:#2E7458; --pass-soft:#D5E7DD;
  --label:#FCFBF7; --font:"Archivo", system-ui, -apple-system, "Segoe UI", sans-serif; --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink);background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.82em;letter-spacing:0}

/* barre */
.bar{display:flex;align-items:center;gap:28px;padding:18px 28px;border-bottom:1.5px dashed var(--line);background:rgba(231,236,239,.92);position:sticky;top:0;z-index:5;backdrop-filter:blur(4px)}
.mark{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:var(--ink)}
.mark b{font-weight:850;font-stretch:125%;font-size:22px;letter-spacing:.02em}
.mark span{font-stretch:88%;font-size:16px;color:var(--ink-soft)}
.modes{display:flex;gap:22px}
.modes button{background:none;border:0;padding:6px 0;cursor:pointer;font-weight:600;font-stretch:96%;color:var(--ink-faint);border-bottom:2px solid transparent}
.modes button[aria-pressed=true]{color:var(--ink);border-bottom:2px dashed var(--ink)}
.bar .spacer{flex:1}
.conn{font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:8px}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--ink-faint)}
.conn.on i{background:var(--pass)}
.lang{display:flex;border:1.5px solid var(--ink);border-radius:3px;overflow:hidden}
.lang button{background:none;border:0;padding:3px 9px;font-size:12px;font-weight:700;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--paper)}

main{max-width:1260px;margin:0 auto;padding:36px 28px 80px}

/* atelier */
.tailor{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:56px;align-items:start}
.intro h1{font-stretch:118%;font-weight:800;font-size:clamp(30px,4vw,46px);line-height:1.04;margin:0 0 14px;letter-spacing:-.01em;max-width:16ch}
.intro p{max-width:58ch;color:var(--ink-soft);margin:0 0 30px;font-size:16px}
.piece{padding:26px 0 28px;border-top:1.5px dashed var(--line)}
.piece h2{font-stretch:112%;font-weight:750;font-size:21px;margin:0 0 4px}
.piece > p{margin:0 0 18px;color:var(--ink-soft);max-width:62ch}
.patterns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pattern{text-align:left;background:transparent;border:1.5px dashed var(--ink-faint);border-radius:3px;padding:14px 14px 12px;cursor:pointer;min-height:118px;display:flex;flex-direction:column;gap:6px}
.pattern strong{font-stretch:100%;font-size:15px}
.pattern small{color:var(--ink-soft);font-size:13px;line-height:1.35}
.pattern em{margin-top:auto;font-style:normal;font-size:12px;color:var(--ink-faint)}
.pattern[aria-pressed=true]{border:1.5px solid var(--ink);background:var(--label)}
.filebtn{margin-top:12px;display:inline-flex;gap:8px;align-items:center;font-size:14px;color:var(--ink-soft);cursor:pointer;text-decoration:underline dashed;text-underline-offset:4px}
.filebtn input{display:none}

.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 22px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.wide{grid-column:1/-1}
.field > span{font-size:13px;color:var(--ink-soft)}
.field input,.field select,.field textarea{background:transparent;border:0;border-bottom:1.5px solid var(--ink-soft);padding:6px 1px;border-radius:0;min-width:0;width:100%}
.field textarea{border:1.5px solid var(--line);border-radius:3px;padding:8px;min-height:64px;resize:vertical;font-family:var(--mono);font-size:13px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--ink);background:rgba(252,251,247,.6)}
.field .hint{font-size:12px;color:var(--ink-faint)}
.field.error input,.field.error textarea{border-color:var(--mark)}
.check{display:flex;gap:10px;align-items:center;font-size:14px}
.check input{accent-color:var(--ink);width:16px;height:16px}

.power{border-left:3px solid var(--line);margin:10px 0;background:rgba(252,251,247,.55)}
.power[data-kind=effect]{border-left-color:var(--ink)}
.power summary{display:flex;align-items:baseline;gap:12px;padding:12px 14px;cursor:pointer;list-style:none}
.power summary::-webkit-details-marker{display:none}
.power summary .kind{font-size:12px;font-weight:700;font-stretch:90%;color:var(--ink-faint);min-width:52px}
.power summary .act{font-weight:650}
.power summary .bound{margin-left:auto;font-size:13px;color:var(--ink-soft);text-align:right}
.power .inner{padding:4px 14px 16px}
.power .inner h3{font-size:13px;font-weight:700;margin:16px 0 8px;color:var(--ink-soft)}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:3px;padding:8px 14px;font-weight:650;font-size:14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.btn.solid{background:var(--ink);color:var(--label)}
.btn.quiet{border-color:var(--ink-faint);color:var(--ink-soft);font-weight:550}
.btn.danger{border-color:var(--mark);color:var(--mark)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.addrow{display:flex;gap:10px;align-items:center;margin-top:14px}
.addrow select{border:0;border-bottom:1.5px solid var(--ink-soft);background:transparent;padding:6px 2px}

.tau{display:grid;grid-template-columns:1fr auto;gap:6px 18px;align-items:center}
.tau input[type=range]{width:100%;accent-color:var(--ink)}
.tau output{font-family:var(--mono);font-size:18px;font-weight:500}
.ladder{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.ladder li{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1.5px dashed var(--line);border-radius:3px;background:rgba(252,251,247,.5)}
.ladder li b{font-weight:650;flex:1}
.ladder li small{color:var(--ink-faint)}
.ladder button{background:none;border:1px solid var(--ink-faint);border-radius:3px;width:26px;height:24px;cursor:pointer;line-height:1}

/* l'étiquette tissée */
.labelcol{position:sticky;top:96px}
.woven{background:var(--label);
  background-image:repeating-linear-gradient(0deg,rgba(28,37,65,.025) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(28,37,65,.02) 0 1px,transparent 1px 3px);
  padding:22px 24px 18px;border-radius:2px;transform:rotate(-.6deg);
  box-shadow:0 1px 0 rgba(28,37,65,.08),0 10px 24px -14px rgba(28,37,65,.45);position:relative}
.woven::before,.woven::after{content:"";position:absolute;left:10px;right:10px;border-top:1.5px dashed rgba(28,37,65,.38)}
.woven::before{top:9px}.woven::after{bottom:9px}
.woven .head{display:flex;justify-content:space-between;align-items:baseline;font-stretch:70%;font-size:13px;color:var(--ink-soft)}
.woven .head b{font-stretch:125%;font-weight:850;font-size:16px;color:var(--ink);letter-spacing:.06em}
.woven h2{font-stretch:78%;font-weight:750;font-size:26px;line-height:1.08;margin:10px 0 4px}
.woven .for{font-stretch:80%;color:var(--ink-soft);margin:0 0 14px;font-size:14px}
.woven h3{font-stretch:76%;font-weight:750;font-size:14px;margin:14px 0 6px;padding-top:10px;border-top:1px solid rgba(28,37,65,.14)}
.woven ul{list-style:none;margin:0;padding:0;font-stretch:80%;font-size:14px}
.woven li{display:flex;justify-content:space-between;gap:12px;padding:2px 0}
.woven li span:last-child{color:var(--ink-soft);text-align:right}
.steps{display:flex;flex-direction:column;gap:6px;font-stretch:80%;font-size:14px}
.step{display:grid;grid-template-columns:118px 1fr 40px;gap:10px;align-items:center}
.step .track{height:10px;background:rgba(28,37,65,.08);position:relative;border-radius:1px}
.step .fill{position:absolute;left:0;top:0;bottom:0;background:var(--ink-faint)}
.step.reach .fill{background:var(--chalk)}
.step.ask .fill{background:var(--ink)}
.step .tick{position:absolute;top:-4px;bottom:-4px;border-left:1.5px solid var(--mark)}
.step .v{font-family:var(--mono);font-size:12px;text-align:right}
.taunote{font-size:12.5px;color:var(--ink-soft);margin:8px 0 0;font-stretch:84%}
.never li{justify-content:flex-start}
.never li::before{content:"✕";color:var(--mark);margin-right:8px;font-weight:700}
.seal{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;padding-top:10px;border-top:1px solid rgba(28,37,65,.14);font-size:12.5px}
.seal .fp{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);word-break:break-all}
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px;white-space:nowrap}
.badge.ok{color:var(--pass)}.badge.bad{color:var(--mark)}.badge.wait{color:var(--ink-faint)}
.labelactions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.errors{margin:14px 0 0;padding:10px 12px;border-left:3px solid var(--mark);background:var(--mark-soft);font-size:13.5px}
.errors li{margin:2px 0}

/* lecture */
.read{display:grid;grid-template-columns:250px minmax(0,1fr) 340px;gap:36px;align-items:start}
.side h2,.panel h2{font-stretch:108%;font-weight:750;font-size:18px;margin:0 0 10px}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.mlist button{width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:8px 10px;cursor:pointer;border-radius:0}
.mlist button[aria-pressed=true]{border-left-color:var(--ink);background:rgba(252,251,247,.7)}
.mlist b{display:block;font-weight:600;font-size:14px;line-height:1.3}
.mlist small{color:var(--ink-faint);font-size:12.5px}
.empty{color:var(--ink-soft);font-size:14px;max-width:46ch}
.mhead h1{font-stretch:108%;font-weight:780;font-size:clamp(22px,2.6vw,30px);line-height:1.12;margin:0 0 8px}
.status{display:inline-block;font-weight:700;font-size:13px;padding:2px 9px;border-radius:2px;background:var(--paper-deep)}
.status.HELD,.status.AWAITING_AUTHORITY{background:var(--chalk-soft)}
.status.CLOSED_COMPLETED,.status.OPEN{background:var(--pass-soft)}
.status.REVOKED,.status.CLOSED_FAILED{background:var(--mark-soft)}
.checks{display:flex;flex-wrap:wrap;gap:8px 20px;margin:14px 0 26px;font-size:13.5px}
.thread{position:relative;padding-left:26px}
.thread::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;border-left:2px dashed var(--line)}
.beat{position:relative;padding:5px 0 9px}
.beat::before{content:"";position:absolute;left:-23px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--paper);border:2px solid var(--ink-faint)}
.beat.pass::before{border-color:var(--pass);background:var(--pass)}
.beat.fail::before{border-color:var(--mark);background:var(--mark)}
.beat.warn::before{border-color:var(--chalk);background:var(--chalk)}
.beat p{margin:0}
.beat .sub{color:var(--ink-soft);font-size:13.5px}
.knot{margin:8px 0 14px;padding:14px 16px;background:rgba(245,230,181,.6);border-left:4px solid var(--chalk);position:relative}
.knot::before{content:"";position:absolute;left:-26px;top:16px;width:14px;height:14px;border-radius:50%;background:var(--chalk);border:3px solid var(--paper)}
.knot > h3{margin:0 0 4px;font-stretch:104%;font-size:16px}
.knot > p{margin:0 0 10px;color:var(--ink-soft);font-size:13.5px}
.round{display:grid;grid-template-columns:150px 1fr;gap:4px 14px;padding:8px 0;border-top:1px dashed rgba(28,37,65,.18);align-items:center}
.round .name{font-weight:650}
.round .meter{display:grid;grid-template-columns:1fr 46px;gap:8px;align-items:center}
.round .note{grid-column:2;font-size:13px;color:var(--ink-soft)}
.round .note.over{color:var(--mark)}
.phone{margin:10px 0;max-width:360px;background:#fff;border-radius:14px;padding:12px;border:1.5px solid rgba(28,37,65,.18)}
.phone .from{font-size:12px;color:var(--ink-faint);margin:0 0 6px}
.phone .msg{background:#EAF6E5;border-radius:10px;padding:10px 12px;font-size:14px}
.phone .btns{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.phone .btns span{display:block;text-align:center;padding:8px;border-radius:8px;background:#F4F6F8;color:#2a6fdb;font-weight:600;font-size:14px}
.phone .btns span.tapped{background:#2a6fdb;color:#fff}
.panel{position:sticky;top:96px;display:flex;flex-direction:column;gap:22px}
.panel .q{font-size:14.5px;margin:0 0 12px}
.panel .opts{display:flex;flex-direction:column;gap:8px}
.raw{font-size:12px}
.raw summary{cursor:pointer;font-size:14px;color:var(--ink-soft)}
.raw table{width:100%;border-collapse:collapse;margin-top:8px}
.raw td{padding:3px 6px;border-top:1px solid rgba(28,37,65,.1);vertical-align:top}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--label);padding:9px 16px;border-radius:3px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:1080px){.read{grid-template-columns:minmax(0,1fr)}.panel{position:static}.side{order:-1}}
@media (max-width:900px){.tailor{grid-template-columns:minmax(0,1fr)}.labelcol{position:static}.patterns{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){main{padding:24px 16px 60px}.bar{padding:12px 16px;gap:14px;flex-wrap:wrap}.fields{grid-template-columns:minmax(0,1fr)}.conn span{display:none}.step{grid-template-columns:96px 1fr 36px}.round{grid-template-columns:minmax(0,1fr)}.round .note{grid-column:1}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>

    <button id="m-read" aria-pressed="false"></button>

  <div class="lang" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="fr">FR</button></div>
</header>
<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

  return `${allErrors.length ? `<ul class="errors">${allErrors.map((e) => `<li><span class="mono">${esc(e.loc)}</span> ${esc(msgText(e.msg))}</li>`).join("")}</ul>` : ""}
      <div class="labelactions"><button class="btn solid" id="download" ${allErrors.length ? "disabled" : ""}>${esc(l.download)}</button>
        <button class="btn" id="copy" ${allErrors.length ? "disabled" : ""}>${esc(l.copy)}</button><button class="btn quiet" id="revise">${esc(l.revise)}</button></div>`;
}
function refreshLabel() {
  $("#label").innerHTML = wovenLabel();
  const f = $("#labelfoot"); if (f) f.innerHTML = labelFoot();
}
let recalcTimer = null;
async function recalc(full) {
  S.errors = H.validateProfile(S.profile);
  S.fp = await H.fingerprint(S.profile);
  if (full) renderTailor(); else { refreshLabel(); const o = $("#tauout"); if (o) o.textContent = S.profile.hesitation.tau_star.toFixed(2); }
  if (S.server) {
    clearTimeout(recalcTimer);
    recalcTimer = setTimeout(async () => {
      try {
        const r = await (await fetch("/api/profiles/validate", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(S.profile) })).json();
        S.libFp = r.valid ? r.fingerprint : null; S.libErrors = r.valid ? null : r.errors;
      } catch { S.libFp = null; }
      refreshLabel();
    }, 350);
  }
}
function selectPattern(id) {
  const c = S.catalog.find((x) => x.id === id) || S.catalog[0];
  S.selected = c.id; S.profile = clone(c.profile); S.open = null; S.libFp = null; S.libErrors = null;
  recalc(true);
}
function newPower(kind) {
  const n = S.profile.powers.filter((x) => x.kind === kind).length + 1;
  const base = { action: `${kind}_${n}`, kind, description: "", identity: [], depends_on: [] };
  if (kind === "effect") {
    let status = S.profile.powers.find((x) => x.kind === "status");
    if (!status) { status = { action: `status_${n}`, kind: "status", description: "", identity: [], depends_on: [] }; S.profile.powers.push(status); }
    Object.assign(base, { budget: 1, identity: ["reference"], envelope: { max_amount: { amount: 100, currency: "EUR" }, amount_field: "amount", currency_field: "currency", allowed: {}, windows: {}, required: ["reference", "amount", "currency"] },
      reconciliation: { status_action: status.action, max_checks: 3, sigma: 0.9, decay: 0.6 } });
  }
  if (kind === "contact") base.sigma = 0.6;
  S.profile.powers.push(base); S.open = S.profile.powers.length - 1; recalc(true);
}
function download() {
  const p = S.profile, blob = new Blob([JSON.stringify(p, null, 2) + "\n"], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `${p.id}.rev${p.revision}.hold.json`; a.click(); URL.revokeObjectURL(a.href);
  toast(L().downloaded);
}
async function revise() {
  const prev = S.fp;
  S.profile.revision = (S.profile.revision || 1) + 1; S.profile.supersedes = prev;
  S.profile.issued_at = new Date().toISOString().replace(/\.\d{3}Z$/, "Z"); delete S.profile.signature;
  await recalc(true); toast(fmt(L().revised, { r: S.profile.revision }));
}

// -- lecture -----------------------------------------------------------------------------------
const pathName = (name, prof) => fmt(L().path[name] || name, { name: prof ? prof.authority.name : "" });
function threadHTML(events, profiles) {
  const l = L(), t = l.t; const out = []; let knot = null;
  const prof = profiles[events[0]?.profile] || Object.values(profiles)[0];
  const flush = () => { if (knot) { out.push(`<div class="knot"><h3>${esc(t.knot_h)}</h3><p>${esc(fmt(t.knot_p, { scope: knot.scope }))}</p>${knot.items.join("")}</div>`); knot = null; } };
  const push = (html) => (knot ? knot.items : out).push(html);
  const beat = (cls, main, sub) => `<div class="beat ${cls}"><p>${main}</p>${sub ? `<p class="sub">${sub}</p>` : ""}</div>`;
  let lastProposal = null, lastRequest = null;
  const positions = {};  // the journal records each position once (POSITION) and decisions refer to it by sequence
  for (const e of events) {
    const d = e.data;
    switch (e.type) {
      case "POSITION": positions[e.seq] = d.position; break;
      case "MISSION_OPENED": out.push(beat("", esc(t.opened), esc(d.title))); break;
      case "PROFILE_ATTACHED": out.push(beat("", esc(fmt(t.profile, { p: d.profile, r: d.revision })), `<span class="mono">${esc(d.fingerprint.slice(0, 24))}…</span>`)); break;
      case "ACTION_ADMITTED": if (d.kind !== "effect") push(beat("pass", esc(fmt(t.admitted, { a: d.action })))); break;
      case "ACTION_REFUSED": push(beat("fail", esc(fmt(t.refused, { a: d.action, rule: d.rule })), esc(d.reason))); break;
      case "EFFECT_RESERVED": push(beat("", esc(fmt(t.reserved, { a: d.action })), `<span class="mono">${esc(d.operation_id)}</span>`)); break;
      case "EFFECT_OUTCOME":
        if (d.status === "CONFIRMED") push(beat("pass", esc(fmt(t.pass, { r: d.receipt }))));
        else if (d.status === "FAILED_PROVEN") push(beat("fail", esc(t.fail), esc(d.reason)));
        else push(beat("warn", esc(t.unknown), esc(d.reason)));
        break;
      case "HOLD_ENTERED": flush(); knot = { scope: d.scope.join(", "), items: [] }; break;
      case "PROPOSAL": lastProposal = d; break;
      case "DECISION": {
        const v = d.verdict, pos = d.position || positions[d.position_seq] || { paths: [], tau_star: 0 };
        if (v.applied == null) { push(`<div class="round"><span class="name">${esc(fmt(t.round, { n: d.round }))}</span><span class="note">${esc(t.stale)}</span></div>`); break; }
        const ps = pos.paths.find((x) => x.name === v.applied) || { sigma: 0 };
        const disc = lastProposal ? lastProposal.discerner : "";
        const note = v.overruled ? `<span class="note over">${esc(fmt(t.proposed_over, { d: disc, p: v.proposed ?? "—", why: v.reason.split(":")[0], a: v.applied }))}</span>` : `<span class="note">${esc(fmt(t.proposed_ok, { d: disc }))}</span>`;
        const cls = v.applied === "ASK_AUTHORITY" ? "ask" : ps.sigma >= pos.tau_star ? "reach" : "";
        push(`<div class="round"><span class="name">${esc(fmt(t.round, { n: d.round }))} · ${esc(pathName(v.applied, prof))}</span>
          <span class="meter step ${cls}" style="display:grid;grid-template-columns:1fr 46px;gap:8px"><span class="track"><span class="fill" style="width:${ps.sigma * 100}%"></span><span class="tick" style="left:${pos.tau_star * 100}%"></span></span><span class="v">${v.applied === "PRESERVE" ? "" : ps.sigma.toFixed(2)}</span></span>${note}<span class="note" data-round="${d.round}"></span></div>`);
        break;
      }
      case "PATH_EXECUTED": {
        const res = (t.result[d.result] || d.result) + (d.correlated ? " · " + t.correlated : "");
        const items = knot ? knot.items : out; const last = items[items.length - 1] || "";
        items[items.length - 1] = last.replace(`<span class="note" data-round="${d.round}"></span>`, `<span class="note">→ ${esc(res)}</span>`);
        break;
      }
      case "DECISION_REQUEST": lastRequest = d; push(beat("warn", esc(fmt(t.request, { to: d.to })))); break;
      case "RELAY_SENT": if (lastRequest) push(`<div class="phone" data-q="${esc(lastRequest.question_id)}"><p class="from">HOLD · ${esc(d.mode)} → ${esc(d.to)}</p><div class="msg">${esc(lastRequest.question)}</div><div class="btns">${lastRequest.options.map((o) => `<span data-code="${esc(o.code)}">${esc(o.title)}</span>`).join("")}</div></div>`); break;
      case "AUTHORITY_ANSWER": {
        const items = knot ? knot.items : out;
        for (let i = items.length - 1; i >= 0; i--) if (items[i].includes(`data-q="${d.question_id}"`)) { items[i] = items[i].replace(`<span data-code="${d.answer}">`, `<span data-code="${d.answer}" class="tapped">`); break; }
        push(beat("pass", esc(fmt(t.answer, { to: prof ? prof.authority.name : "", code: d.answer })), esc(d.channel))); break;
      }
      case "AUTHORITY_GRANT": push(beat("pass", esc(fmt(t.grant, { kind: d.grant.kind })))); break;
      case "RELAY_REJECTED": push(beat("fail", esc(fmt(t.rejected, { r: d.reason })))); break;
      case "RECONCILED": push(beat("pass", esc(fmt(t.reconciled, { r: d.receipt })))); break;
      case "RESUMED": push(beat("pass", esc(t.resumed))); flush(); break;
      case "PRESERVED": push(beat("warn", esc(fmt(t.preserved, { r: d.reason })))); break;
      case "REVOKED": push(beat("fail", esc(fmt(t.revoked, { by: d.by })))); flush(); break;
      case "MISSION_CLOSED": flush(); out.push(beat(d.outcome === "CLOSED_COMPLETED" ? "pass" : "warn", esc(fmt(t.closed, { o: L().status[d.outcome] || d.outcome })))); break;
    }
  }
  flush();
  return out.join("");
}
async function computeChecks(journal) {
  const chain = await H.verifyChain(journal.events);
  const dec = H.decisionReplay(journal.events, journal.profiles);
  return { chain, dec };
}
function checksHTML() {
  const l = L(), c = S.checks; if (!c) return "";
  const parts = [c.chain.valid ? `<span class="badge ok">${ICON.ok} ${esc(fmt(l.chain_ok, { n: c.chain.count }))}</span>` : `<span class="badge bad">${ICON.bad} ${esc(fmt(l.chain_bad, { seq: c.chain.brokenAt, reason: c.chain.reason }))}</span>`,
    c.dec.matches ? `<span class="badge ok">${ICON.ok} ${esc(fmt(l.dec_ok, { n: c.dec.checked }))}</span>` : `<span class="badge bad">${ICON.bad} ${esc(fmt(l.dec_bad, { n: c.dec.mismatches.length }))}</span>`];
  const st = S.detail && S.detail.verification && S.detail.verification.state;
  if (st) parts.push(st.matches ? `<span class="badge ok">${ICON.ok} ${esc(l.state_ok)}</span>` : `<span class="badge bad">${ICON.bad} ${esc(l.state_bad)}</span>`);
  return parts.join("");
}
function panelHTML() {
  const l = L(); const req = S.detail && S.detail.open_request;
  let html = `<div><h2>${esc(l.request_h)}</h2>`;
  if (!req) html += `<p class="empty">${esc(l.no_request)}</p>`;
  else {
    html += `<p class="q">${esc(req.question)}</p>`;
    if (S.relayMode === "cloud") html += `<p class="empty">${esc(l.waiting)}</p>`;
    html += `<p style="font-size:13px;color:var(--ink-soft);margin:10px 0 6px">${esc(l.answer_here)}</p><div class="opts">${req.options.map((o) => `<button class="btn" data-answer="${esc(o.code)}" data-q="${esc(req.question_id)}">${esc(o.title)}</button>`).join("")}</div>`;
    if (S.relayMode === "simulated") html += `<p style="font-size:13px;color:var(--ink-soft);margin:16px 0 6px">${esc(l.simulate)}</p><div class="opts">${req.options.map((o) => `<button class="btn quiet" data-tap="${esc(o.code)}">${esc(o.title)}</button>`).join("")}<button class="btn danger" data-tap="${esc(req.options[0].code)}" data-stranger="1">${esc(l.stranger)}</button></div>`;
  }
  html += `</div>`;
  const j = S.journal;
  if (j) html += `<details class="raw"><summary>${esc(l.raw)}</summary><table>${j.events.map((e) => `<tr><td class="mono">${e.seq}</td><td>${esc(e.type)}</td><td class="mono">${esc(e.hash.slice(0, 10))}</td></tr>`).join("")}</table></details>`;
  return html;
}
function renderRead() {
  const l = L();
  const list = S.server ? (S.missions.length ? `<ul class="mlist">${S.missions.map((m) => `<li><button data-mission="${esc(m.id)}" aria-pressed="${S.mission === m.id}"><b>${esc(m.title)}</b><small>${esc(l.status[m.status] || m.status)}</small></button></li>`).join("")}</ul>` : `<p class="empty">${esc(l.no_missions)}</p>`) : `<p class="empty">${esc(l.offline_read)}</p>`;
  const j = S.journal;
  const center = j ? `<div class="mhead"><h1>${esc(j.mission.title)}</h1><span class="status ${esc(j.mission.status)}">${esc(l.status[j.mission.status] || j.mission.status)}</span></div>
      <div class="checks">${checksHTML()}</div><div class="thread">${threadHTML(j.events, j.profiles)}</div>` : `<p class="empty">${esc(l.pick)}</p>`;
  $("#app").innerHTML = `<div class="read"><aside class="side"><h2>${esc(l.missions_h)}</h2>${list}<label class="filebtn">${esc(l.open_journal)}<input type="file" accept=".json,application/json" id="journalfile"></label></aside>
    <section>${center}</section><aside class="panel">${panelHTML()}</aside></div>`;
}
async function loadMission(id, quiet) {
  const r = await fetch(`/api/missions/${encodeURIComponent(id)}`);
  if (!r.ok) return;
  S.detail = await r.json(); S.journal = S.detail.journal; S.mission = id; S.checks = await computeChecks(S.journal);
  if (S.mode === "read") renderRead();
  clearTimeout(S.poll);
  if (!["CLOSED_COMPLETED", "CLOSED_UNCONFIRMED", "CLOSED_FAILED", "REVOKED"].includes(S.journal.mission.status)) S.poll = setTimeout(() => refreshRead(true), 2000);
}
async function refreshRead(quiet) {
  if (!S.server) return renderRead();
  try { S.missions = await (await fetch("/api/missions")).json(); } catch { S.missions = []; }
  if (S.mission) await loadMission(S.mission, quiet); else renderRead();
}

// -- général -------------------------------------------------------------------------------
function render() {
  const l = L();
  document.documentElement.lang = S.lang;
  $("#m-tailor").textContent = l.tailor; $("#m-read").textContent = l.read;
  $("#m-tailor").setAttribute("aria-pressed", S.mode === "tailor"); $("#m-read").setAttribute("aria-pressed", S.mode === "read");
  document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === S.lang));
  $("#conn").className = "conn" + (S.server ? " on" : ""); $("#conn span").textContent = S.server ? l.online : l.offline;
  if (S.mode === "tailor") renderTailor(); else renderRead();
}
document.addEventListener("input", (ev) => {
  const el = ev.target;
  if (!el.dataset || !el.dataset.path || S.mode !== "tailor") return;
  setPath(S.profile, el.dataset.path, coerce(el));
  recalc(false);
});
document.addEventListener("change", async (ev) => {
  const el = ev.target;
  if (el.dataset && el.dataset.roleIndex !== undefined) {
    S.profile.powers.forEach((p, i) => { if (i === +el.dataset.roleIndex && el.checked) p.role = "support"; else if (p.role === "support" && i === +el.dataset.roleIndex) delete p.role; else if (el.checked && p.role === "support") delete p.role; });
    return recalc(true);
  }
  if (el.dataset && el.dataset.path && S.mode === "tailor") { setPath(S.profile, el.dataset.path, coerce(el)); return recalc(true); }
  if (el.id === "profilefile" && el.files[0]) {
    try { S.profile = JSON.parse(await el.files[0].text()); S.selected = null; S.libFp = null; recalc(true); } catch (e) { toast(String(e.message || e)); }
  }
  if (el.id === "journalfile" && el.files[0]) {
    try { S.journal = JSON.parse(await el.files[0].text()); S.detail = null; S.mission = null; S.checks = await computeChecks(S.journal); renderRead(); } catch (e) { toast(String(e.message || e)); }
  }
});
document.addEventListener("click", async (ev) => {
  const b = ev.target.closest("button, summary"); if (!b) return;
  if (b.id === "m-tailor" || b.id === "m-read") { S.mode = b.id === "m-tailor" ? "tailor" : "read"; pref("mode", S.mode); clearTimeout(S.poll); render(); if (S.mode === "read") refreshRead(); return; }
  if (b.dataset.lang) { S.lang = b.dataset.lang; pref("lang", S.lang); render(); return; }
  if (b.dataset.pattern) return selectPattern(b.dataset.pattern);
  if (b.tagName === "SUMMARY") { const d = b.parentElement; S.open = d.open ? null : +d.dataset.index; return; }
  if (b.dataset.remove !== undefined) { S.profile.powers.splice(+b.dataset.remove, 1); S.open = null; return recalc(true); }
  if (b.dataset.move !== undefined) { const i = +b.dataset.move, j = i + +b.dataset.dir, a = S.profile.hesitation.ladder; [a[i], a[j]] = [a[j], a[i]]; return recalc(true); }
  if (b.id === "addpower") return newPower($("#newkind").value);
  if (b.id === "download") return download();
  if (b.id === "copy") { try { await navigator.clipboard.writeText(JSON.stringify(S.profile, null, 2)); toast(L().copied); } catch { toast("Clipboard unavailable"); } return; }
  if (b.id === "revise") return revise();
  if (b.dataset.mission) { S.mission = b.dataset.mission; return loadMission(S.mission); }
  if (b.dataset.answer) {
    const r = await (await fetch(`/api/missions/${encodeURIComponent(S.mission)}/answer`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ question_id: b.dataset.q, code: b.dataset.answer }) })).json();
    toast(r.accepted ? fmt(L().answered, { code: b.dataset.answer }) : fmt(L().refused_answer, { reason: r.reason })); return setTimeout(() => loadMission(S.mission), 400);
  }
  if (b.dataset.tap) {
    const r = await (await fetch(`/api/missions/${encodeURIComponent(S.mission)}/simulate-tap`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ code: b.dataset.tap, stranger: !!b.dataset.stranger }) })).json();
    const res = (r.results || [])[0] || {}; toast(res.accepted ? fmt(L().answered, { code: b.dataset.tap }) : fmt(L().refused_answer, { reason: res.reason })); return setTimeout(() => loadMission(S.mission), 400);
  }
});

(async function boot() {
  S.lang = pref("lang") || ((navigator.language || "").toLowerCase().startsWith("fr") ? "fr" : "en");
  S.mode = new URLSearchParams(location.search).get("mode") || pref("mode") || "tailor";
  S.catalog = CATALOG_EMBEDDED;
  if (location.protocol.startsWith("http")) {
    try {
      const h = await (await fetch("/api/health")).json(); S.server = !!h.ok; S.relayMode = h.whatsapp && h.whatsapp.mode;
      const c = await (await fetch("/api/catalog")).json(); if (c.templates && c.templates.length) S.catalog = c.templates;
    } catch { S.server = false; }
  }
  const first = S.catalog.find((c) => c.id === "reservation-voyage") || S.catalog[0];
  S.selected = first.id; S.profile = clone(first.profile);
  S.errors = H.validateProfile(S.profile); S.fp = await H.fingerprint(S.profile);
  render();
  if (S.mode === "read") refreshRead(); else recalc(false);
})();
</script>
