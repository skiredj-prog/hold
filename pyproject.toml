[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hold-habilitation"
version = "0.1.0"
description = "HOLD — prêt-à-porter habilitation for autonomous agents: a portable profile, a floor that cannot be crossed, hesitation instead of guessing, and a verifiable journal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "À définir" }
authors = [{ name = "Abdelaziz Skiredj" }]
dependencies = ["pydantic>=2.7", "pyyaml>=6", "httpx>=0.27"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8"]

[project.scripts]
hold = "hold.cli:main"

[tool.setuptools.packages.find]
include = ["hold*"]

[tool.setuptools.package-data]
hold = ["studio/*", "profiles/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
