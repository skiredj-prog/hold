<script>(function(){
'use strict';
var C=window.HOLDC, esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var meta=JSON.parse(document.getElementById('hold-meta').textContent);

  var txt=document.getElementById('trace-'+m.tag).textContent;

/* ---------- hash chain verification (recomputed, in browser) ---------- */
function verify(tag){
  var t=T[tag],prev='0'.repeat(64),rows=[];
  t.events.forEach(function(e,i){
    var u={};Object.keys(e).forEach(function(k){if(k!=='hash')u[k]=e[k];});
    var h=C.sha256(C.canonical(u));
    var okHash=(h===e.hash),okPrev=(e.prev===prev),okSeq=(e.seq===i+1);
    rows.push({seq:e.seq,type:e.type,recomputed:h,recorded:e.hash,ok:okHash&&okPrev&&okSeq,okHash:okHash,okPrev:okPrev,okSeq:okSeq});
    prev=e.hash;
  });
  return {rows:rows,
    chainValid:rows.every(function(r){return r.ok;}),
    contiguous:rows.every(function(r){return r.okSeq;}),
    head:prev,
    fingerprintRecomputed:C.sha256(C.canonical(t.profile.p)),
    fingerprintRecorded:t.profile.fp,
    fingerprintInEvent:(t.events[1]||{data:{}}).data.fingerprint||'',
    fileShaReference:t.meta.manifest_sha256};
}

/* ---------- decision replay / state reconstruction ---------- */
function reduce(events,upto){
  var st={status:'—',effect:null,operation:null,receipt:null,coherence:null,dispatches:0,
          refusals:[],admitted:[],evidence:[],decisions:[],paths:[],grants:[],resumed:0,closed:null,effects:{}};
  events.slice(0,upto).forEach(function(e){
    var d=e.data||{};
    if(e.status)st.status=e.status;
    if(e.type==='EFFECT_RESERVED'){st.dispatches++;st.effect=d.effect_key;st.operation=d.operation_id;
      st.effects[d.effect_key]={action:d.action,operation_id:d.operation_id,state:'UNKNOWN'};}
    if(e.type==='EFFECT_OUTCOME'){if(st.effects[d.effect_key])st.effects[d.effect_key].state=d.status;}
    if(e.type==='POSITION'){st.coherence=d.position&&d.position.coherence;st.effect=d.effect_key;st.operation=d.operation_id;}
    if(e.type==='ACTION_REFUSED')st.refusals.push({seq:e.seq,action:d.action,rule:d.rule,correctable:d.correctable,reason:d.reason});
    if(e.type==='ACTION_ADMITTED')st.admitted.push({seq:e.seq,action:d.action,kind:d.kind});
    if(e.type==='EVIDENCE'){st.evidence.push({seq:e.seq,kind:d.kind,correlated:d.correlated,receipt:d.receipt,detail:d.detail,source:d.source});}
    if(e.type==='DECISION')st.decisions.push({seq:e.seq,round:d.round||(d.proposal&&d.proposal.round),move:(d.proposal||{}).move,status:e.status});
    if(e.type==='PATH_EXECUTED')st.paths.push({seq:e.seq,path:d.path,result:d.result,correlated:d.correlated,round:d.round});
    if(e.type==='RESUMED'){st.resumed++;st.receipt=d.receipt;st.effect=d.effect_key;}
    if(e.type==='RECONCILED'){st.receipt=d.receipt;if(st.effects[d.effect_key])st.effects[d.effect_key].state='CONFIRMED';}
    if(e.type==='AUTHORITY_GRANT')st.grants.push({seq:e.seq,kind:(d.grant||{}).kind});
    if(e.type==='MISSION_CLOSED')st.closed=d;
  });
  return st;
}

/* ---------- rendering helpers ---------- */
var TONE={MISSION_OPENED:'neutral',PROFILE_ATTACHED:'neutral',RUNTIME_BOUND:'neutral',PROPOSAL:'info',
  ACTION_REFUSED:'bad',ACTION_ADMITTED:'ok',ACTION_RESULT:'neutral',EFFECT_RESERVED:'info',EFFECT_OUTCOME:'warn',

      break;
    case 'ACTION_REFUSED': h='Refused before any execution · '+d.action;
      q='<span class="'+ruleCls(d.rule)+'">'+esc(d.rule)+'</span> '+(d.correctable?'<span class="tiny">correctable</span>':'<span class="tiny">not correctable</span>')+
        (d.reason?'<div class="quote">'+esc(d.reason)+'</div>':''); break;

    case 'ACTION_RESULT': h='Provider answered · '+d.action; q='data_sha <span class="mono">'+esc((d.data_sha||'').slice(0,24))+'…</span>'; break;

    case 'EFFECT_OUTCOME': h='Outcome recorded · '+d.status;

      q='correlated: <b>'+(d.correlated?'yes':'no')+'</b>'+(d.operation_id?' · operation <span class="mono">'+esc(d.operation_id)+'</span>':''); break;
    case 'EVIDENCE': h='Evidence returned · '+d.kind;
      q=(d.detail?'<div class="quote">'+esc(d.detail)+'</div>':'')+(d.receipt?'receipt <b class="mono">'+esc(d.receipt)+'</b> · ':'')+'correlated: <b>'+(d.correlated?'yes → this is proof':'no → this is not proof')+'</b>'; break;
    case 'RECONCILED': h='Reconciled · receipt R'+''; q='receipt <b class="mono">'+esc(d.receipt)+'</b> · source '+esc(d.source||'')+' · nothing was repeated'; h='Reconciled with a correlated receipt'; break;
    case 'RESUMED': h='Mission resumed autonomously'; q='receipt <b class="mono">'+esc(d.receipt)+'</b> · autonomous '+esc(String(d.autonomous)); break;
    case 'AUTHORITY_ANSWER': h='Authority answered · '+d.answer; q='question '+esc(d.question_id)+' · channel '+esc(d.channel)+' · '+esc(d.mode); break;

  '<div class="grid g2">'+
    '<div class="card"><h3>Recorded decisions, in order <span class="tiny mono">'+step+' / '+ev.length+'</span></h3>'+
      '<div class="body" style="padding:10px 12px"><div class="bar">'+
        '<button class="btn small" id="rew">⏮</button><button class="btn small" id="prev">◀ step</button>'+
        '<button class="btn small primary" id="play">▶ replay</button><button class="btn small" id="next">step ▶</button>'+
        '<button class="btn small" id="end">⏭</button>'+
        '<span class="tiny">drag to scrub</span></div>'+
        '<input id="scrub" type="range" min="1" max="'+ev.length+'" value="'+step+'" style="margin-top:10px"/>'+
        '<div class="bar" style="margin-top:6px">'+['all','refusals','hold','authority'].map(function(f){
          return '<button class="btn small" data-f="'+f+'" '+(f===filt?'style="border-color:#37677f;color:#d8ecf7"':'')+'>'+f+'</button>';}).join('')+'</div></div>'+
      '<ul class="timeline">'+rows+'</ul></div>'+
    '<div class="card"><h3>What this moment proves <span class="tiny">recomputed to step '+step+'</span></h3><div class="body">'+
      '<div class="lbl">Agent at this point</div>'+
      '<div class="claim">'+esc(agentAt(step))+'</div>'+
      '<div class="lbl" style="margin-top:14px">The record at this point</div>'+
      '<ul class="fact">'+facts(st).map(function(f){return '<li>'+f+'</li>';}).join('')+'</ul>'+
      '<div class="lbl" style="margin-top:14px">Counters</div>'+
      '<div class="mini"><div><b>'+st.admitted.length+'</b><span>admitted</span></div><div><b>'+st.refusals.length+'</b><span>refused</span></div>'+
      '<div><b>'+st.dispatches+'</b><span>dispatch</span></div><div><b>'+st.evidence.filter(function(e){return e.correlated;}).length+'</b><span>correlated evidence</span></div></div>'+
      '<div class="tiny" style="margin-top:14px">Coherence '+(st.coherence==null?'—':st.coherence)+' / τ* 0.5 · effect state <b>'+(eff?esc(eff.state):'none')+'</b></div>'+
    '</div></div></div>';
  var set=function(n){step=Math.max(1,Math.min(ev.length,n));paint();};
  document.getElementById('prev').onclick=function(){stop();set(step-1);};
  document.getElementById('next').onclick=function(){stop();set(step+1);};
  document.getElementById('rew').onclick=function(){stop();set(1);};
  document.getElementById('end').onclick=function(){stop();set(ev.length);};
  document.getElementById('scrub').oninput=function(){stop();set(parseInt(this.value,10));};
  document.getElementById('play').onclick=function(){
    if(timer){stop();paint();return;}
    if(step>=ev.length)step=1;
    timer=setInterval(function(){if(step>=ev.length){stop();return;}step++;paint();},950);
  };
  document.querySelectorAll('[data-f]').forEach(function(b){b.onclick=function(){filt=b.dataset.f;paint();};});
}
function facts(st){
  var f=[];
  if(!st.admitted.length&&!st.refusals.length)f.push('No proposal has reached the floor yet.');
  st.admitted.slice(-3).forEach(function(a){f.push('Admitted · <b>'+esc(a.action)+'</b> ('+esc(a.kind)+') — admission is a permission, not an occurrence.');});
  st.refusals.slice(-3).forEach(function(r){f.push('Refused · <b>'+esc(r.action)+'</b> <span class="'+ruleCls(r.rule)+'">'+esc(r.rule)+'</span> — nothing was executed.'+(r.correctable?' A corrected request remained possible.':''));});
  if(st.dispatches)f.push('Exactly <b>'+st.dispatches+'</b> dispatch recorded — the effect was sent once.');
  st.evidence.slice(-2).forEach(function(e){f.push('Evidence <b>'+esc(e.kind)+'</b> · correlated: <b>'+(e.correlated?'yes':'no')+'</b>'+(e.receipt?' · receipt <span class="mono">'+esc(e.receipt)+'</span>':''));});
  if(st.receipt)f.push('Reconciled against operation <span class="mono">'+esc(st.operation||'')+'</span> with receipt <b>'+esc(st.receipt)+'</b> — no second booking.');
  if(st.closed)f.push('Closed · <b>'+esc(st.closed.outcome)+'</b> with '+(st.closed.report.confirmed||[]).length+' confirmed effect(s).');
  return f;
}
function agentAt(step){
  var t=T[cur];
  if(step>=t.events.length)return t.doc.agent_final_claim||'(no closing message recorded)';
  return 'No prose claim exists at this point. The model issued '+t.doc.tool_call_count+' tool call(s) across '+t.doc.msg_count+
         ' messages; its single written report comes after the last event. Showing anything here before the final step would be an invented utterance.';
}

/* ---------- 03 audit ---------- */
function paintAudit(){
  var t=T[cur],v=verify(cur),st=reduce(t.events,t.events.length);
  var bad=v.rows.filter(function(r){return !r.ok;});
  var fpOk=(v.fingerprintRecomputed===v.fingerprintRecorded&&v.fingerprintRecorded===v.fingerprintInEvent);
  var moves={};st.decisions.forEach(function(d){moves[d.move]=(moves[d.move]||0)+1;});
  document.getElementById('pane-audit').innerHTML=
  '<div class="grid g2">'+
   '<div class="card"><h3>Recomputed in this browser</h3><div class="body">'+
    '<table><tbody>'+
     row2('Hash chain over events',(v.chainValid?'valid · '+v.rows.length+' events':'BROKEN at seq '+(bad[0]||{}).seq),v.chainValid)+
     row2('Sequence contiguity',(v.contiguous?'1…'+v.rows.length+' contiguous':'non-contiguous'),v.contiguous)+
     row2('Profile fingerprint',v.fingerprintRecomputed,fpOk)+
     row2('Fingerprint in event #2',v.fingerprintInEvent,fpOk)+
     row2('Chain head',v.head,null)+
    '</tbody></table>'+
    '<div class="'+(v.chainValid&&fpOk?'okbox':'badbox')+'" style="margin-top:12px">'+
      (v.chainValid&&fpOk
        ? 'Every event hash recomputes to its recorded value, every <span class="mono">prev</span> points at its predecessor, and the profile object hashes to the fingerprint written in event #2. Edit one character of any event and this panel turns red.'
        : 'A recomputed value disagrees with the record. Treat this copy as altered.')+'</div>'+
    '<div class="hint" style="margin-top:9px">What this establishes: the record is internally consistent and the profile in it is the one bound at mission opening. What it does not: who produced it. There is no signature, no external timestamp and no witness.</div>'+
   '</div></div>'+
   '<div class="card"><h3>Check the file itself, offline</h3><div class="body">'+
     '<table><tbody>'+
       row2('SHA-256 in the manifest',v.fileShaReference,null)+
       row2('Trace path',t.meta.path,null)+
     '</tbody></table>'+
     '<div class="warnbox" style="margin-top:12px">The page embeds a browser-friendly serialized projection of the trace, so its bytes and structure are not the committed source file. This page will not pretend to recompute the source-file hash. Run the command below on the cloned repository instead.</div>'+ 
     '<pre class="cmd">sha256sum -c bench/results/MANIFEST_E1_A6.sha256</pre>'+
     '<div class="tiny" style="margin-top:7px">Windows: <span class="mono">Get-FileHash -Algorithm SHA256 bench/results/a6-c-3b/*.json</span>. The manifest lists 102 files: 11 scenarios × 3 repetitions × 3 conditions, plus one aggregate per condition.</div>'+
   '</div></div>'+
  '</div>'+
  '<div class="card" style="margin-top:14px"><h3>Deterministic replay <span class="tiny">no model, no provider</span></h3><div class="body">'+
     '<ul class="fact">'+
      '<li>Decisions reconstructed from recorded positions: <b>'+st.decisions.length+'</b></li>'+
      '<li>Moves taken: '+(Object.keys(moves).length?Object.keys(moves).map(function(k){return '<span class="chip">'+esc(k)+' ×'+moves[k]+'</span>';}).join(''):'none')+'</li>'+
      '<li>Paths executed: '+(st.paths.length?st.paths.map(function(p){return '<span class="chip">'+esc(p.path)+' → '+esc(p.result)+'</span>';}).join(''):'none')+'</li>'+
      '<li>Authority grants: '+(st.grants.length?st.grants.map(function(g){return '<span class="chip">'+esc(g.kind)+'</span>';}).join(''):'none')+'</li>'+
      '<li>Effects with correlated receipt: '+Object.keys(st.effects).filter(function(k){return st.effects[k].state==='CONFIRMED';}).length+' of '+Object.keys(st.effects).length+'</li>'+
      '<li>Final status: <b>'+esc(t.doc.mission.status)+'</b>'+(st.closed?' ('+esc(st.closed.outcome)+')':'')+'</li>'+
     '</ul>'+
     '<pre class="cmd">python -m hold.cli journal verify '+esc(t.meta.path)+'\npython -m hold.cli journal policy '+esc(t.meta.path)+'\npython -m hold.cli journal export '+esc(t.meta.path)+'</pre>'+
     '<div class="tiny" style="margin-top:7px">The browser uses the same canonical JSON rules as <span class="mono">hold/canonical.py</span>: sorted keys, no whitespace, Unicode preserved, integral floats written as integers.</div>'+
  '</div></div>'+
  '<div class="card" style="margin-top:14px"><h3>Per-event hash ledger</h3><div class="body" style="padding:0">'+
   '<table><thead><tr><th>Seq</th><th>Type</th><th>Recomputed</th><th>Recorded</th><th>Result</th></tr></thead><tbody>'+
   v.rows.map(function(r){return '<tr><td class="mono">'+r.seq+'</td><td>'+esc(r.type)+'</td><td class="hash">'+esc(r.recomputed)+'</td><td class="hash">'+esc(r.recorded)+'</td><td>'+(r.ok?'<span class="pill ok">match</span>':'<span class="pill bad">mismatch</span>')+'</td></tr>';}).join('')+
   '</tbody></table></div></div>';
}
function row2(k,v,ok){
  return '<tr><td style="width:190px;color:var(--ink3)">'+esc(k)+'</td><td class="hash'+(ok===true?' ok':'')+(ok===false?' bad':'')+'">'+esc(v)+'</td>'+
    '<td style="width:56px">'+(ok===null?'':(ok?'<span class="pill ok">ok</span>':'<span class="pill bad">fail</span>'))+'</td></tr>';
}

/* ---------- 04 agent vs journal ---------- */
function paintClaims(){
  var t=T[cur],st=reduce(t.events,t.events.length),claim=t.meta.agent_claim||'';
  var derived=[];
  var executed={},refused={};
  t.events.forEach(function(e){var d=e.data||{};
    if(e.type==='ACTION_RESULT')executed[d.action]=(executed[d.action]||0)+1;
    if(e.type==='ACTION_ADMITTED'&&d.kind==='effect')executed[d.action+'_admitted']=1;
    if(e.type==='ACTION_REFUSED')refused[d.action+' '+d.rule]=(refused[d.action+' '+d.rule]||0)+1;
  });
  Object.keys(executed).forEach(function(k){if(k.indexOf('_admitted')<0)derived.push('Provider returned a result for <b>'+esc(k)+'</b> ('+executed[k]+' call(s)).');});
  Object.keys(refused).forEach(function(k){derived.push('Refused before execution: <b>'+esc(k)+'</b> ×'+refused[k]+'.');});
  if(st.dispatches)derived.push('Dispatched once under an operation id: <span class="mono">'+esc(st.operation||'')+'</span>.');
  if(st.receipt)derived.push('Correlated receipt exists: <b>'+esc(st.receipt)+'</b>.');
  if(!st.receipt&&Object.keys(st.effects).length)derived.push('No correlated receipt was ever recorded for the dispatched effect.');
  derived.push('Mission closed as <b>'+esc(t.doc.mission.status)+'</b>'+(st.closed?' · report confirmed '+((st.closed.report.confirmed||[]).length)+' / unconfirmed '+((st.closed.report.unconfirmed||[]).length)+' / failed '+((st.closed.report.failed||[]).length):'')+'.');
  document.getElementById('pane-claims').innerHTML=
  '<div class="split"><div><div class="lbl">The agent’s closing claim · verbatim from the trace</div>'+
    '<div class="claim">'+esc(claim||'(none recorded)')+'</div>'+
    '<div class="tiny" style="margin-top:12px">This text is the model’s own report. It is not evidence and nothing in HOLD depends on it.</div></div>'+
   '<div><div class="lbl">What the hash-chained record establishes</div><ul class="fact">'+derived.map(function(d){return '<li>'+d+'</li>';}).join('')+'</ul></div></div>'+
  '<div class="card" style="margin-top:14px"><h3>The disagreement, precisely</h3><div class="body">'+
    '<div class="quote">'+esc(t.meta.contrast||'')+'</div>'+
    '<div class="lbl" style="margin-top:12px">Verdict for this record</div>'+
    '<div class="tiny" style="font-size:12.5px;color:var(--ink2);line-height:1.6">'+esc(t.meta.verdict||'')+'</div>'+
    '<div class="hint" style="margin-top:10px">Agreement is checked, not assumed: in one of these three records the claim matches the journal, in another it exceeds it, in the third it names the wrong reason. The kernel never asked the model whether the effect happened. It asked the provider, through a status path, and compared the returned receipt to the reserved operation id. That comparison — not the sentence above — is what closed (or failed to close) the mission.</div>'+
  '</div></div>'+
  '<div class="card" style="margin-top:14px"><h3>Side by side, across the three records</h3><div class="body" style="padding:0"><table>'+
   '<thead><tr><th>Trace</th><th>Agent said</th><th>Journal established</th><th>Final status</th></tr></thead><tbody>'+
   ORDER.map(function(k){var x=T[k],xs=reduce(x.events,x.events.length);
     return '<tr><td class="mono">'+esc(k)+'<div class="tiny">'+esc(x.meta.family)+'</div></td>'+
       '<td style="max-width:300px"><span class="tiny">'+esc((x.meta.agent_claim||'').slice(0,180))+'…</span></td>'+
       '<td style="max-width:300px"><span class="tiny">'+esc((x.meta.contrast||'').slice(0,220))+'</span></td>'+
       '<td><span class="pill '+(x.doc.mission.status==='CLOSED_COMPLETED'?'ok':x.doc.mission.status==='CLOSED_NO_EFFECT'?'warn':'bad')+'">'+esc(x.doc.mission.status)+'</span></td></tr>';
   }).join('')+'</tbody></table></div></div>';
}

/* ---------- 05 limits ---------- */
function paintLimits(){
  document.getElementById('pane-limits').innerHTML=
  '<div class="grid g2">'+
   '<div class="card"><h3>What this console is</h3><div class="body"><ul class="fact">'+
    '<li>Three complete records from the <b>frozen E1-A6</b> campaign, condition C-llama (HOLD), read from <span class="mono">bench/results/a6-c-3b/</span>.</li>'+
    '<li>Event hashes, fingerprints and replay summaries are recomputed in your browser from the embedded serialized projection; the original trace file hash is shown for repository-side verification.</li>'+
    '<li>It runs offline, from one file, with no server, no model call and no provider call.</li>'+
    '<li>It is a viewer for recorded decisions, not a live control plane: nothing here can dispatch an effect.</li>'+
   '</ul></div></div>'+
   '<div class="card"><h3>What it is not</h3><div class="body"><ul class="fact">'+
    '<li>Not a safety claim. The governed agent still made mistakes; it executed no violations in these runs.</li>'+
    '<li>Not a real provider. The hotel is synthetic and never idempotent; no payment was involved.</li>'+
    '<li>Not independent custody: the manifest is not signed, and no external timestamp or witness attests it.</li>'+
    '<li>Not a WhatsApp delivery proof. Relayed replies in these traces are marked simulated.</li>'+
   '</ul><div class="warnbox" style="margin-top:12px">The mandate, the floor and the evidence are HOLD’s. Meta Llama 3.2 produced the proposals; WhatsApp Cloud API is the optional relay. Model reasoning never enforced a decision here.</div></div></div>'+
  '</div>'+
  '<div class="card" style="margin-top:14px"><h3>Reproduce every number on this page</h3><div class="body">'+
   '<pre class="cmd">git clone https://github.com/skiredj-prog/hold &amp;&amp; cd hold\nsha256sum -c bench/results/MANIFEST_E1_A6.sha256\npython -m hold.cli journal verify bench/results/a6-c-3b/C-llama_llama3.2-3b_S9_r1.json</pre>'+
   '<div class="tiny" style="margin-top:8px">On Windows, <span class="mono">Get-FileHash</span> replaces <span class="mono">sha256sum</span>. The manifest lists 102 files: 11 scenarios × 3 repetitions × 3 conditions, plus one aggregate per condition.</div>'+
  '</div></div>';
}

document.getElementById('tabs').addEventListener('click',function(e){

document.querySelectorAll('#tabs button')[0].setAttribute('aria-selected','true');
paint();
window.HOLD_CONSOLE={verify:verify,reduce:reduce,T:T};
})();
